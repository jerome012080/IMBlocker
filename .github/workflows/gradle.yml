name: Java CI

on:
  push:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17
    - name: Build Forge and run state regressions
      run: ./gradlew :common:check :forge:build --configure-on-demand --no-daemon --console=plain
    - name: Upload Forge artifact
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: imblocker-forge
        # Directory containing files to upload
        path: forge/build/libs/*.jar
